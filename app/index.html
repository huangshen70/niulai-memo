<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>牛来备忘录</title>
<style>
:root{
  --bg:#eef1f7;--bg2:#e6ebf5;--card:#fff;--card2:#f7f9fc;
  --tx:#0f1320;--sub:#6b7280;--line:rgba(15,19,32,.08);--line2:rgba(15,19,32,.12);
  --blue:#2563eb;--blue2:#3b82f6;--green:#10b981;--amber:#f59e0b;--red:#ef4444;--violet:#7c3aed;
  --r:22px;--shadow:0 1px 2px rgba(16,24,40,.05),0 14px 34px -16px rgba(16,24,40,.28);
}
@media(prefers-color-scheme:dark){
  :root{--bg:#0d1017;--bg2:#0a0d13;--card:#151a23;--card2:#11161e;--tx:#e9eef7;--sub:#98a2b3;
    --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 18px 40px -18px rgba(0,0,0,.7)}
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"Inter",-apple-system,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;
  background:radial-gradient(1200px 620px at 8% -12%,rgba(59,130,246,.14),transparent 60%),
             radial-gradient(900px 520px at 104% 4%,rgba(124,58,237,.12),transparent 55%),var(--bg);
  color:var(--tx);height:100vh;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}

/* ---------- 顶栏 ---------- */
header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 24px;flex:none}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:20px;
  background:linear-gradient(145deg,#3b82f6,#2563eb);box-shadow:0 8px 18px -8px rgba(37,99,235,.9)}
.brand b{display:block;font-size:16px;letter-spacing:-.3px;line-height:1.2}
.brand span{display:block;font-size:11.5px;color:var(--sub);margin-top:2px;letter-spacing:.2px}
.r{display:flex;align-items:center;gap:12px}

/* 设置：大号圆形按钮 */
.round{width:50px;height:50px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;
  font-size:20px;color:#fff;background:linear-gradient(150deg,#4f8bff,#2563eb);
  box-shadow:0 10px 22px -10px rgba(37,99,235,.95),inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .18s cubic-bezier(.2,.9,.3,1.2),box-shadow .18s}
.round:hover{transform:translateY(-1px) rotate(-8deg);box-shadow:0 14px 26px -10px rgba(37,99,235,1)}
.round:active{transform:scale(.94)}
.round svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- 版块 ---------- */
main{flex:1;display:grid;grid-template-rows:minmax(0,.92fr) minmax(0,1.08fr);gap:16px;padding:0 20px 20px;min-height:0}
section{background:var(--card);border-radius:var(--r);display:flex;flex-direction:column;min-height:0;
  box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden;position:relative}
.sec{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px 10px;flex:none}
.sec h2{font-size:19px;font-weight:800;letter-spacing:-.4px;display:flex;align-items:center;gap:9px}
.sec h2 em{width:4px;height:18px;border-radius:99px;background:linear-gradient(180deg,#3b82f6,#7c3aed);display:inline-block;font-style:normal}
.sec h2 small{font-weight:600;font-size:11.5px;color:var(--sub);letter-spacing:0}
.sec .btn.warn{padding:7px 13px;font-size:12.5px;border-radius:10px}
.stats{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.st{font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--card2);color:var(--sub);border:1px solid var(--line)}
.st.l1{color:#0f9d58;background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.22)}
.st.l2{color:#b26b00;background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.25)}
.st.l3{color:#d92d20;background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.22)}

/* ---------- 按钮 ---------- */
button{font:inherit;cursor:pointer;border:0;transition:transform .16s,filter .16s,background .16s,box-shadow .16s}
.btn{font-size:13.5px;font-weight:800;letter-spacing:.2px;padding:10px 18px;border-radius:12px;white-space:nowrap;
  background:linear-gradient(180deg,#3b82f6,#2563eb);color:#fff;box-shadow:0 10px 20px -12px rgba(37,99,235,.95)}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.97)}
.btn.g{background:var(--card2);color:var(--tx);border:1px solid var(--line2);box-shadow:none}
.btn.g:hover{background:rgba(120,130,150,.14)}
.btn.warn{background:rgba(239,68,68,.1);color:#dc2626;border:1px solid rgba(239,68,68,.22);box-shadow:none}
.btn.warn:hover{background:rgba(239,68,68,.16)}
.btn.ok{background:linear-gradient(180deg,#34d399,#10b981);box-shadow:0 10px 20px -12px rgba(16,185,129,.95)}

/* ---------- 输入区 ---------- */
.quick{display:flex;gap:10px;padding:0 20px 8px;flex:none;align-items:flex-end}
.quick textarea{flex:1;resize:none;overflow:hidden;font-size:14px;line-height:1.5;padding:11px 15px;border-radius:14px;
  color:var(--tx);background:var(--card2);border:1.5px solid transparent;outline:0;transition:.18s;max-height:110px}
.quick textarea::placeholder{color:var(--sub)}
.quick textarea:focus{background:var(--card);border-color:var(--blue2);box-shadow:0 0 0 4px rgba(59,130,246,.16)}

.scroll{overflow:auto;padding:6px 20px 20px;flex:1;min-height:0}
.scroll::-webkit-scrollbar{width:10px}
.scroll::-webkit-scrollbar-thumb{background:rgba(120,130,150,.28);border-radius:9px;border:3px solid transparent;background-clip:content-box}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:12px}

/* ---------- 事项卡 ---------- */
.note{position:relative;background:var(--card);border-radius:16px;padding:13px 14px 13px 16px;border:1px solid var(--line);
  box-shadow:0 1px 2px rgba(16,24,40,.04);animation:in .32s cubic-bezier(.2,.9,.3,1.15);transition:box-shadow .18s,transform .18s}
.note:hover{box-shadow:0 12px 28px -18px rgba(16,24,40,.5);transform:translateY(-1px)}
.note::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:99px;background:var(--bar)}
.note.l1{--bar:#10b981;--tint:rgba(16,185,129,.09)}
.note.l2{--bar:#f59e0b;--tint:rgba(245,158,11,.1)}
.note.l3{--bar:#ef4444;--tint:rgba(239,68,68,.1)}
.note{background:linear-gradient(90deg,var(--tint),transparent 72%),var(--card)}
.nhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;gap:8px;padding-right:32px}
.flag{font-size:10.5px;font-weight:800;letter-spacing:.3px;padding:2.5px 8px;border-radius:6px;color:#fff;background:var(--bar)}
.note p{font-size:15px;font-weight:700;line-height:1.55;word-break:break-word;cursor:pointer;outline:0;border-radius:8px;white-space:pre-wrap}
.note p:focus{background:rgba(120,130,150,.1);box-shadow:0 0 0 4px rgba(120,130,150,.1)}
.note.done{opacity:.55}
.note.done p{text-decoration:line-through}
.ckn{width:22px;height:22px;border-radius:50%;border:2px solid rgba(120,130,150,.45);background:transparent;flex:none;display:grid;place-items:center}
.ckn:hover{border-color:var(--green)}
.ckn.on{background:var(--green);border-color:var(--green)}
.ckn.on::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2.2px 2.2px 0;transform:rotate(45deg) translate(-1px,-1px)}
/* 卡片右上角关闭：常显、实心红底，一眼就能看到 */
.x{position:absolute;top:7px;right:7px;background:rgba(239,68,68,.92);color:#fff;font-size:15px;font-weight:700;line-height:1;
  width:27px;height:27px;border-radius:9px;border:0;display:grid;place-items:center;transition:.16s;opacity:1;z-index:3;
  box-shadow:0 5px 12px -6px rgba(239,68,68,.95),inset 0 0 0 1px rgba(255,255,255,.25);cursor:pointer}
.x:hover{background:#dc2626;transform:scale(1.1);box-shadow:0 8px 18px -8px rgba(220,38,38,1)}

/* ---------- 流程卡 ---------- */
.wf{border-radius:18px;padding:16px 16px 14px;position:relative;color:#1b2130;overflow:hidden;
  box-shadow:0 10px 26px -18px rgba(16,24,40,.55),inset 0 0 0 1px rgba(255,255,255,.6);
  animation:in .36s cubic-bezier(.2,.9,.3,1.15);transition:transform .18s,box-shadow .18s}
.wf:hover{transform:translateY(-2px);box-shadow:0 18px 36px -20px rgba(16,24,40,.6),inset 0 0 0 1px rgba(255,255,255,.7)}
.wf h3{font-size:15px;font-weight:800;margin:0 2px 10px 0;padding-right:86px;white-space:pre-wrap;word-break:break-word;letter-spacing:-.2px}
.wf .x{background:#e8524a;color:#fff;box-shadow:0 5px 12px -7px rgba(232,82,74,.95),inset 0 0 0 1px rgba(255,255,255,.28)}
.wf .x:hover{background:#dc2626;color:#fff}
.wf .edit{position:absolute;top:7px;right:40px;width:27px;height:27px;border-radius:9px;background:rgba(255,255,255,.92);
  color:#374151;font-size:14px;display:grid;place-items:center;opacity:1;transition:.16s;z-index:3;
  box-shadow:0 4px 10px -7px rgba(16,24,40,.7),inset 0 0 0 1px rgba(0,0,0,.1)}
.wf .edit:hover{background:#111827;color:#fff;transform:scale(1.1)}
.step{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:13.5px;font-weight:600;cursor:pointer;user-select:none;border-radius:8px;transition:background .16s}
.step:hover{background:rgba(255,255,255,.45)}
.ck{width:19px;height:19px;border-radius:50%;border:2px solid rgba(0,0,0,.28);flex:none;display:grid;place-items:center;transition:.22s;background:rgba(255,255,255,.5)}
.step:hover .ck{border-color:rgba(0,0,0,.55)}
.step.on .ck{background:#111827;border-color:#111827}
.step.on .ck::after{content:"";width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.step.on span{text-decoration:line-through;opacity:.5}
.step span{white-space:pre-wrap;word-break:break-word}
.wf.single .step{padding:2px 0}
.prog{height:5px;background:rgba(0,0,0,.1);border-radius:99px;margin-top:11px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#111827,#374151);border-radius:99px;transition:width .45s cubic-bezier(.2,.9,.3,1)}
.wf.fin{filter:saturate(.6);opacity:.82}
.badge{position:absolute;top:13px;right:76px;background:rgba(17,24,39,.9);color:#fff;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:99px}
.empty{color:var(--sub);text-align:center;padding:34px 20px;font-size:13.5px;grid-column:1/-1;line-height:1.7}
.empty b{display:block;font-size:15px;color:var(--tx);margin-bottom:6px;font-weight:800}

/* ---------- 弹窗 ---------- */
.ov{position:fixed;inset:0;background:rgba(10,14,22,.4);backdrop-filter:blur(10px);display:grid;place-items:center;z-index:40;
  opacity:0;pointer-events:none;transition:opacity .22s}
.ov.show{opacity:1;pointer-events:auto}
.m{background:var(--card);width:min(560px,94vw);max-height:88vh;overflow:auto;border-radius:26px;padding:28px;
  box-shadow:0 40px 90px -30px rgba(0,0,0,.6);border:1px solid var(--line);animation:pop .34s cubic-bezier(.2,.9,.3,1.1)}
.m h2{font-size:21px;font-weight:800;letter-spacing:-.4px;margin-bottom:18px;display:flex;align-items:center;gap:10px}
.m h2 em{width:4px;height:20px;border-radius:99px;background:linear-gradient(180deg,#3b82f6,#7c3aed);font-style:normal}
.m label{font-size:12.5px;font-weight:800;color:var(--sub);margin:20px 0 9px;display:flex;justify-content:space-between;align-items:center;letter-spacing:.2px}
.m label:first-of-type{margin-top:0}
.m label span{font-weight:600;color:var(--sub);opacity:.85}
.m textarea.big,.m input.big{width:100%;height:48px;font-size:15px;font-weight:600;padding:12px 15px;border-radius:14px;
  background:var(--card2);border:1.5px solid transparent;outline:0;color:var(--tx);resize:none;overflow:hidden;line-height:1.5;transition:.18s}
.m textarea.big:focus,.m input.big:focus{background:var(--card);border-color:var(--blue2);box-shadow:0 0 0 4px rgba(59,130,246,.16)}
#steps{display:flex;flex-direction:column;gap:9px;position:relative}
.sr{display:flex;align-items:flex-start;gap:9px;will-change:transform}
.sr.drag{position:relative;z-index:3;box-shadow:0 18px 34px -16px rgba(16,24,40,.5);border-radius:16px}
.sr.drag textarea{background:var(--card);border-color:var(--blue2);box-shadow:0 0 0 4px rgba(59,130,246,.14)}
.sr .n{width:30px;height:30px;border-radius:10px;background:linear-gradient(160deg,#60a5fa,#2563eb);color:#fff;font-size:12.5px;
  font-weight:800;display:grid;place-items:center;flex:none;margin-top:9px;cursor:grab;touch-action:none;user-select:none;
  transition:transform .16s,box-shadow .16s;box-shadow:0 6px 14px -8px rgba(37,99,235,.9)}
.sr .n:active{cursor:grabbing;transform:scale(1.08)}
.sr .n:hover{box-shadow:0 0 0 4px rgba(59,130,246,.18)}
.sr textarea{width:100%;min-height:46px;font-size:14.5px;font-weight:600;padding:11px 14px;border-radius:14px;
  background:var(--card2);border:1.5px solid transparent;outline:0;color:var(--tx);resize:none;overflow:hidden;line-height:1.5;transition:.18s}
.sr textarea:focus{background:var(--card);border-color:var(--blue2);box-shadow:0 0 0 4px rgba(59,130,246,.16)}
.sr .d{width:34px;height:34px;border-radius:10px;flex:none;background:transparent;color:var(--sub);font-size:15px;
  display:grid;place-items:center;margin-top:6px}
.sr .d:hover{background:rgba(239,68,68,.12);color:#dc2626}
.m .btn{height:42px;padding:0 20px;font-size:14px}
.m #addStep{width:100%;margin-top:11px;background:rgba(59,130,246,.1);color:var(--blue);height:40px;border:1.5px dashed rgba(59,130,246,.35);box-shadow:none}
.m #addStep:hover{background:rgba(59,130,246,.16)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--card2);color:var(--tx);padding:7px 13px;border-radius:10px;font-size:12.5px;font-weight:700;border:1px solid var(--line2)}
.chip:hover{background:var(--blue);color:#fff;border-color:var(--blue)}
.chip b{opacity:.45;margin-left:6px}
/* 保存为历史版本：勾选框紧贴文字 */
.tg{display:inline-flex;align-items:center;gap:7px;margin-top:16px;font-size:13.5px;font-weight:700;color:var(--tx);cursor:pointer;user-select:none}
.tg input{width:17px;height:17px;accent-color:var(--blue);margin:0;cursor:pointer}
.foot{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
.foot .btn{flex:1}.foot #ok,.foot #ok2{flex:2}

/* ---------- 等级选择气泡 ---------- */
#lvPop{position:fixed;z-index:45;background:var(--card);border-radius:16px;border:1px solid var(--line);
  box-shadow:0 24px 50px -22px rgba(16,24,40,.66);padding:8px;display:flex;flex-direction:column;gap:4px;min-width:172px;
  opacity:0;pointer-events:none;transform:translateY(6px) scale(.96);transform-origin:50% 100%;transition:.18s cubic-bezier(.2,.9,.3,1.2)}
#lvPop.show{opacity:1;pointer-events:auto;transform:none}
#lvPop .t{font-size:10.5px;font-weight:800;color:var(--sub);padding:4px 8px 6px;letter-spacing:.4px}
#lvPop button{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:11px;font-size:13.5px;font-weight:800;
  background:transparent;color:var(--tx);text-align:left}
#lvPop button i{width:9px;height:9px;border-radius:50%;background:var(--d);flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--d) 20%,transparent)}
#lvPop button:hover{background:var(--card2);transform:translateX(2px)}
#lvPop button[data-lv="1"]{--d:#10b981}
#lvPop button[data-lv="2"]{--d:#f59e0b}
#lvPop button[data-lv="3"]{--d:#ef4444}
#lvPop small{margin-left:auto;font-size:11px;font-weight:700;color:var(--sub)}

/* ---------- 宠物 / 气泡 ---------- */
#cv,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#cv{z-index:15}#fx{z-index:19}
#bubble{position:fixed;z-index:16;max-width:264px;padding:10px 14px;font-size:13px;line-height:1.5;opacity:0;
  transition:opacity .18s,transform .18s cubic-bezier(.2,.9,.3,1.2);pointer-events:none;white-space:pre-wrap;word-break:break-word;
  transform:translate(-50%,-100%) translateY(4px) scale(.96);transform-origin:var(--pd-ax,50%) 100%}
#bubble.show{opacity:1;transform:translate(-50%,-100%)}
.pd-bub{background:var(--pd-bg);color:var(--pd-fg);border:2px solid var(--pd-bd)}
.pd-bub::after{content:"";position:absolute;left:var(--pd-ax,50%);width:12px;height:12px;background:var(--pd-bg);
  transform:translateX(-50%) rotate(45deg);border-right:2px solid var(--pd-bd);border-bottom:2px solid var(--pd-bd);bottom:-8px}
.pd-bub.pixel{border-radius:0;font-weight:700;box-shadow:4px 4px 0 rgba(15,19,32,.22);padding:9px 13px}
.pd-bub.pixel::after{width:10px;height:10px;bottom:-7px}
.pd-bub.round{border-radius:16px;border-width:1px;box-shadow:0 12px 30px -12px rgba(16,24,40,.4)}
.pd-bub.round::after{border-width:0 1px 1px 0}
.pd-bub.sharp{border-radius:5px;border-width:2px;border-left-width:5px;border-color:var(--pd-bd);border-left-color:var(--pd-accent);font-weight:700;
  box-shadow:0 12px 28px -14px rgba(16,24,40,.42)}
.pd-bub.ornate{border-radius:14px;border-width:2px;font-weight:700;
  box-shadow:0 0 0 3px rgba(255,255,255,.55) inset,0 14px 32px -14px rgba(16,24,40,.42)}
#hint{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(10px);background:rgba(17,24,39,.92);color:#fff;
  font-size:12.5px;font-weight:700;padding:9px 18px;border-radius:99px;opacity:0;transition:.24s;pointer-events:none;z-index:18}
#hint.show{opacity:1;transform:translateX(-50%)}
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-10px);background:rgba(17,24,39,.94);color:#fff;
  font-size:12.5px;font-weight:700;padding:10px 20px;border-radius:99px;opacity:0;transition:.24s;pointer-events:none;z-index:60;
  box-shadow:0 16px 34px -18px rgba(0,0,0,.8)}
#toast.show{opacity:1;transform:translateX(-50%)}
@keyframes in{from{opacity:0;transform:translateY(8px) scale(.98)}}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.95)}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">🐮</div>
    <div><b>牛来备忘录</b><span>待办 · 流程 · 有宠物陪着</span></div>
  </div>
  <div class="r">
    <button class="round" id="btnSettings" title="设置">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"></circle>
        <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-2.87 1.2V21a2 2 0 1 1-4 0v-.11a1.7 1.7 0 0 0-2.9-1.2l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4 15a1.7 1.7 0 0 0-1.56-1H2.3a2 2 0 1 1 0-4h.14A1.7 1.7 0 0 0 4 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.5V4.3a2 2 0 1 1 4 0v.2a1.7 1.7 0 0 0 2.87 1.2l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.5 9v.1a1.7 1.7 0 0 0 1.56 1h.14a2 2 0 1 1 0 4h-.14a1.7 1.7 0 0 0-1.56 1z"></path></svg>
    </button>
  </div>
</header>

<main>
  <section id="top">
    <div class="sec">
      <h2><em></em>重要事项<small>任务 · 通知</small></h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center">
        <div class="stats" id="stats"></div>
        <button class="btn warn" id="clearNotes">清空已完成</button>
      </div>
    </div>
    <div class="quick">
      <textarea id="ni" rows="1" placeholder="记下一条任务或通知，回车添加，Shift+回车换行"></textarea>
      <button class="btn" id="na">添加</button>
    </div>
    <div class="scroll"><div class="grid" id="notes"></div></div>
  </section>

  <section id="bot">
    <div class="sec">
      <h2><em></em>工作流程<small id="cnt"></small></h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
        <button class="btn warn" id="clearDone">清空已完成</button>
        <button class="btn g" id="newTask">＋ 待办任务</button>
        <button class="btn" id="newWf">＋ 新建流程</button>
      </div>
    </div>
    <div class="scroll"><div class="grid" id="wfs"></div></div>
  </section>
</main>

<!-- 新建 / 编辑流程 -->
<div class="ov" id="ov"><div class="m">
  <h2><em></em><span id="mTitle">新建工作流程</span></h2>
  <label id="tplLb">历史模板<span>点击套用</span></label><div class="chips" id="tpls"></div>
  <label>标题</label><textarea class="big" id="wt" rows="1" placeholder="例：夏季碎花连衣裙"></textarea>
  <label>流程步骤<span>按住序号上下拖动排序</span></label><div id="steps"></div>
  <button class="btn" id="addStep">＋ 添加步骤</button>
  <label class="tg"><input type="checkbox" id="saveTpl" checked><span>保存为历史模板</span></label>
  <div class="foot"><button class="btn g" id="cancel">取消</button><button class="btn" id="ok">创建</button></div>
</div></div>

<!-- 待办任务 -->
<div class="ov" id="ov2"><div class="m" style="width:min(460px,94vw)">
  <h2><em></em><span id="m2Title">新建待办任务</span></h2>
  <label>任务内容</label><textarea class="big" id="tt" rows="1" placeholder="例：给客户回电话"></textarea>
  <div class="foot"><button class="btn g" id="c2">取消</button><button class="btn" id="ok2">创建</button></div>
</div></div>

<!-- 首次起名 -->
<div class="ov" id="ov3"><div class="m" style="width:min(430px,94vw);text-align:center">
  <h2 style="justify-content:center;margin-bottom:6px"><em></em>给你的宠物起个名字</h2>
  <p style="color:var(--sub);font-size:13.5px;line-height:1.7;margin:6px 0 18px">它会陪着你完成每一件事，<br>你每完成一步，它就长大一点 ✨</p>
  <input class="big" id="petNameInput" maxlength="12" placeholder="小新" style="text-align:center">
  <div class="foot"><button class="btn" id="ok3" style="flex:1">就叫这个名字</button></div>
</div></div>

<div id="lvPop">
  <div class="t">这条事项有多重要？</div>
  <button data-lv="1"><i></i>次要<small>随手记</small></button>
  <button data-lv="2"><i></i>重要<small>要跟进</small></button>
  <button data-lv="3"><i></i>非常重要<small>优先做</small></button>
</div>

<canvas id="fx"></canvas>
<canvas id="cv"></canvas>
<div id="bubble" class="pd-bub"></div>
<div id="hint"></div>
<div id="toast"></div>

<script src="vendor/matter.min.js"></script>
<script src="js/petdraw.js"></script>
<script>
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const MAC=['#ffd6e0','#ffe5b4','#fff3b0','#d4f4dd','#c9eefc','#d9d4ff','#f6d0ff','#ffd1c1','#c7f0e1','#e3f0a8'];
const LV={1:'次要',2:'重要',3:'非常重要'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const xpNeed=lv=>50+lv*30;
let S=null, pet=null, editingWf=null, editingTask=null, pendText='';

// 鼠标悬停宠物时的互动台词（12 条，轮换不重复）
const CHAT=[
  '别戳啦，我在看着你呢～',
  '这一步做完了吗？我帮你记着。',
  '摸鱼可以，先把这条做完吧！',
  '我在这儿陪着你，加油！',
  '要不要喝口水再继续？',
  '你今天的表现已经很棒啦。',
  '有点困…让我眯一小会儿。',
  '下一个任务是什么？我都准备好了！',
  '别拖了，先做五分钟试试。',
  '嘿嘿，被你发现我在偷懒了。',
  '主人，长按我可以发射哦！',
  '主人求点击摸摸头',
];
let chatPool=[];

// ---------------------------------------------------------------- 初始化
(async function init(){
  S = await window.api.getStore();
  migrateLegacy();
  buildPet();
  render();
  bindAll();
  window.api.onStoreChanged(s=>{ S=s; render(); syncPet(); });
  firstRun();
})();

function migrateLegacy(){
  if(S.meta && S.meta.legacyMigrated) return;
  let moved=false;
  try{
    const n=JSON.parse(localStorage.getItem('nl_notes')||'null');
    const w=JSON.parse(localStorage.getItem('nl_wfs')||'null');
    const t=JSON.parse(localStorage.getItem('nl_tpls')||'null');
    if(n&&n.length&&!S.notes.length){S.notes=n;moved=true}
    if(w&&w.length&&!S.wfs.length){S.wfs=w;moved=true}
    if(t&&t.length&&(!S.tpls||!S.tpls.length)){S.tpls=t;moved=true}
  }catch(e){}
  S.meta=Object.assign({},S.meta,{legacyMigrated:true});
  if(moved) toast('已迁移旧数据');
  persist();
}

function persist(){ window.api.setStore(S); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2200); }

// ---------------------------------------------------------------- 宠物
function buildPet(){
  const speed = S.settings.walkSpeed || 5;
  pet = new PetCanvas($('#cv'), {
    size: 98,
    skin: S.pet.skin || PET_DEFAULT_SKIN,
    x: innerWidth - 130, y: innerHeight - 150,
    bounds: { w: innerWidth, h: innerHeight },
  });
  pet.setSpeedLevel(speed);
  pet.idleAt(innerWidth-130, innerHeight-150);
  syncPet();

  addEventListener('resize', ()=>{
    pet.resize();
    pet.idleAt(innerWidth-130, innerHeight-150);
  });

  // 跟随鼠标：恒速走过去（不是瞬移），走到鼠标旁就停下。
  // 设置里关掉「跟随鼠标走路」后，宠物只在原地小幅活动。
  document.addEventListener('mousemove', e=>{
    if(pet.mode==='drag') return;
    if(S.settings.followMouse===false){
      petHoverCheck(e.clientX, e.clientY);
      return;
    }
    pet.followMouse(e.clientX, e.clientY, 46);
    petHoverCheck(e.clientX, e.clientY);
  });
  document.documentElement.addEventListener('mouseleave', ()=>{ pet.idleAt(innerWidth-130, innerHeight-150); petHoverOut(); });

  // 弹弓 + 点击
  let drag=null;
  const inModal=t=>t&&t.closest&&(t.closest('.ov.show')||t.closest('.m')||t.closest('#lvPop.show'));
  document.addEventListener('pointerdown', e=>{
    if(e.button!==0) return;
    if(inModal(e.target)) return;
    if(!pet.hitTest(e.clientX, e.clientY, 26)) return;
    e.preventDefault();
    drag={x0:pet.x,y0:pet.y,sx:e.clientX,sy:e.clientY};
    pet.mode='drag';
    pet.state='walk';
    document.body.style.cursor='grabbing';
  });
  document.addEventListener('pointermove', e=>{
    if(!drag) return;
    pet.x = drag.x0 + (e.clientX - drag.sx);
    pet.y = drag.y0 + (e.clientY - drag.sy);
    const pull = Math.hypot(pet.x-drag.x0, pet.y-drag.y0);
    if(pull>6) hint(`松手弹射 · 力度 ${Math.min(100, Math.round(pull/2.2))}`);
  });
  document.addEventListener('pointerup', e=>{
    if(!drag) return;
    const dx = pet.x-drag.x0, dy = pet.y-drag.y0;
    const pull = Math.hypot(dx,dy);
    drag=null; document.body.style.cursor='';
    hint(null);
    if(pull < 8){
      pet.mode='roam';
      pet.setState('happy');
      pet.tx = pet.x; pet.ty = pet.y;
      // 点击宠物偶尔触发互动
      if(Math.random() < 0.55) say(nextChat());
      return;
    }
    const k = 0.09;
    const ok = pet.launch(-dx*k, -dy*k, {w:innerWidth,h:innerHeight});
    if(!ok){ pet.mode='roam'; pet.tx=pet.x; pet.ty=pet.y; }
    setTimeout(()=>{ if(pet.mode==='roam'){ pet.tx=pet.x; pet.ty=pet.y; } }, 900);
  });

  // 气泡跟随宠物头部
  (function follow(){
    if(bubbleVisible) placeBubble();
    requestAnimationFrame(follow);
  })();
}

function nextChat(){
  if(!chatPool.length) chatPool=[...CHAT].sort(()=>Math.random()-.5);
  return chatPool.pop();
}
// 鼠标是否停在宠物身上（与是否跟随鼠标无关）
function petHoverCheck(x,y){
  if(pet.hitTest(x, y, 52)) petHoverIn();
  else petHoverOut();
}
let hoveringPet=false, hoverAt=0;
function petHoverIn(){
  if(hoveringPet) return;
  hoveringPet=true;
  const now=Date.now();
  if(now-hoverAt<220) return;
  hoverAt=now;
  // 悬停时给一句互动台词
  setTimeout(()=>{ if(hoveringPet) say(nextChat()); }, 140);
}
function petHoverOut(){ hoveringPet=false; }

function hint(msg){ const h=$('#hint'); if(msg){h.textContent=msg;h.classList.add('show')}else h.classList.remove('show'); }

// ---- 气泡：精准定位在宠物头顶 ----
let bubbleVisible=false, bubbleUntil=0;
function say(text, ms=3600){
  const b=$('#bubble');
  if(!text) return;
  stylePetBubble(b, S.pet.skin || PET_DEFAULT_SKIN);
  b.textContent=text;
  b.style.setProperty('--pd-ax','50%');
  b.classList.add('show');
  bubbleVisible=true;
  placeBubble();
  bubbleUntil=Date.now()+ms;
  clearTimeout(say._t);
  say._t=setTimeout(()=>{ b.classList.remove('show'); bubbleVisible=false; }, ms);
}
function placeBubble(){
  const b=$('#bubble');
  if(!bubbleVisible||!pet) return;
  const top = pet.headTop()-9;
  const half = b.offsetWidth/2 || 100;
  let cx = pet.x;
  cx = Math.min(innerWidth-10-half, Math.max(10+half, cx));
  b.style.left = cx+'px';
  b.style.top = Math.max(6, top)+'px';
  // 箭头指向宠物（气泡被夹紧时箭头跟着偏移）
  const ax = Math.min(Math.max(pet.x-(cx-half),18), (half*2)-18);
  b.style.setProperty('--pd-ax', ax+'px');
}

// ---------------------------------------------------------------- 经验值
function addXp(n, reason){
  const p=S.pet;
  p.xp += n;
  let leveled=false;
  while(p.xp >= xpNeed(p.lv)){ p.xp -= xpNeed(p.lv); p.lv++; leveled=true; }
  persist();
  renderXp();
  if(leveled){ pet.celebrate(); say(`升级啦！现在是 Lv.${p.lv} 🎉`); }
  else if(reason) toast(`+${n} 经验 · ${reason}`);
}
function renderXp(){
  const p=S.pet;
  const ratio = Math.min(1, p.xp/xpNeed(p.lv));
  if(pet) pet.setProgress(p.lv, ratio);
}
function syncPet(){
  if(!pet) return;
  pet.setSkin(S.pet.skin||PET_DEFAULT_SKIN);
  pet.setSpeedLevel(S.settings.walkSpeed||5);
  renderXp();
}

// ---------------------------------------------------------------- 渲染
const isFin=w=>w.steps.length>0&&w.steps.every(s=>s.d);

function render(){
  const ns=[...S.notes].sort((a,b)=>(a.done?1:0)-(b.done?1:0)||b.lv-a.lv);
  $('#notes').innerHTML=ns.map(n=>`<div class="note l${n.lv} ${n.done?'done':''}">
      <div class="nhead"><span class="flag">${LV[n.lv]}</span><button class="ckn ${n.done?'on':''}" data-tn="${n.id}" title="标记完成"></button></div>
      <p data-n="${n.id}">${esc(n.t)}</p>
      <button class="x" data-dn="${n.id}" title="删除">✕</button>
    </div>`).join('')
    || `<div class="empty"><b>还没有事项</b>在上面输入一条，点「添加」并选择它的重要程度</div>`;

  const un=S.notes.filter(n=>!n.done);
  $('#stats').innerHTML=un.length
    ? [1,2,3].map(l=>`<span class="st l${l}">${LV[l]} ${un.filter(n=>n.lv===l).length}</span>`).join('')
    : '<span class="st">全部完成</span>';

  const ws=[...S.wfs].sort((a,b)=>(isFin(a)?1:0)-(isFin(b)?1:0));
  $('#cnt').textContent=ws.length?`${ws.filter(isFin).length}/${ws.length} 已完成`:'';
  $('#wfs').innerHTML=ws.map(w=>{
    const d=w.steps.filter(s=>s.d).length, f=isFin(w);
    const ed=`<button class="edit" data-ew="${w.id}" title="编辑">✎</button>`;
    if(w.single) return `<div class="wf single ${f?'fin':''}" style="background:${w.c}" data-card="${w.id}">
        ${ed}<button class="x" data-dw="${w.id}" title="删除">✕</button>
        <div class="step ${f?'on':''}" data-w="${w.id}" data-i="0" style="font-size:14.5px;padding-right:70px">
          <div class="ck"></div><span>${esc(w.t)}</span></div></div>`;
    return `<div class="wf ${f?'fin':''}" style="background:${w.c}" data-card="${w.id}">
        ${ed}<button class="x" data-dw="${w.id}" title="删除">✕</button>
        ${f?'<span class="badge">✓ 已完成</span>':''}
        <h3>${esc(w.t)}</h3>
        ${w.steps.map((s,i)=>`<div class="step ${s.d?'on':''}" data-w="${w.id}" data-i="${i}">
          <div class="ck"></div><span>${esc(s.t)}</span></div>`).join('')}
        <div class="prog"><i style="width:${d/w.steps.length*100}%"></i></div></div>`;
  }).join('')
    || `<div class="empty"><b>还没有流程</b>点右上角「新建流程」，把一件事拆成几步</div>`;

  renderXp();
}

// ---------------------------------------------------------------- 事项操作
const grow=el=>{el.style.height='auto';el.style.height=el.scrollHeight+3+'px'};
document.addEventListener('input',e=>{if(e.target.tagName==='TEXTAREA')grow(e.target)});

// 点「添加」：先让用户选重要程度
function openLvPick(){
  const t=$('#ni').value.trim();
  if(!t){ toast('先写点内容吧'); $('#ni').focus(); return; }
  pendText=t;
  const pop=$('#lvPop'), r=$('#na').getBoundingClientRect();
  pop.classList.add('show');
  // 显示后再量尺寸，贴到按钮上方
  const pw=pop.offsetWidth, ph=pop.offsetHeight;
  let left=r.right-pw;
  left=Math.max(12, Math.min(innerWidth-pw-12, left));
  let top=r.top-ph-8;
  if(top<8) top=r.bottom+8;
  pop.style.left=left+'px';
  pop.style.top=top+'px';
}
function closeLvPick(){ $('#lvPop').classList.remove('show'); }
$('#lvPop').onclick=e=>{
  const b=e.target.closest('button[data-lv]'); if(!b) return;
  const t=pendText; if(!t) return;
  S.notes.push({id:uid(),t,lv:+b.dataset.lv,done:false});
  $('#ni').value=''; grow($('#ni'));
  closeLvPick();
  persist(); render();
  toast('已添加 · '+LV[+b.dataset.lv]);
};
document.addEventListener('pointerdown',e=>{
  if(!$('#lvPop').classList.contains('show')) return;
  if($('#lvPop').contains(e.target)||e.target===$('#na')) return;
  closeLvPick();
});
$('#na').onclick=openLvPick;
$('#ni').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();openLvPick()}};

$('#notes').onclick=e=>{
  const t=e.target;
  if(t.dataset.tn){
    const n=S.notes.find(x=>x.id===t.dataset.tn);
    if(!n) return;
    n.done=!n.done;
    if(n.done) addXp(5,'完成通知'); else persist();
    render();
    return;
  }
  if(t.dataset.dn){ S.notes=S.notes.filter(x=>x.id!==t.dataset.dn); persist(); render(); return; }
  if(t.dataset.n){
    if(t.isContentEditable) return;
    const n=S.notes.find(x=>x.id===t.dataset.n);
    t.contentEditable='plaintext-only';t.style.cursor='text';t.focus();
    const r=document.createRange();r.selectNodeContents(t);r.collapse(false);
    const s=getSelection();s.removeAllRanges();s.addRange(r);
    const end=ok=>{t.onblur=t.onkeydown=null;t.contentEditable='false';t.style.cursor='';
      const v=t.textContent.trim();if(ok&&v)n.t=v;persist();render()};
    t.onblur=()=>end(true);
    t.onkeydown=ev=>{
      if(ev.key==='Enter'&&!ev.shiftKey&&!ev.isComposing){ev.preventDefault();end(true)}
      else if(ev.key==='Escape'){t.onblur=null;end(false)}
    };
  }
};

// ---------------------------------------------------------------- 流程卡
$('#wfs').onclick=e=>{
  const dw=e.target.dataset.dw;
  if(dw){ S.wfs=S.wfs.filter(x=>x.id!==dw); persist(); return render(); }
  const ew=e.target.dataset.ew;
  if(ew){ return openEdit(ew); }
  const st=e.target.closest('.step');
  if(!st) return;
  const w=S.wfs.find(x=>x.id===st.dataset.w);
  if(!w) return;
  const s=w.steps[+st.dataset.i];
  const was=isFin(w);
  s.d=!s.d;
  persist(); render();
  if(!was&&isFin(w)){
    const el=document.querySelector(`[data-card="${w.id}"]`);
    if(el){const r=el.getBoundingClientRect();boom(r.left+r.width/2,r.top+r.height/2)}
    addXp(20,'完成任务');
  }else if(s.d){
    addXp(10,'完成一步');
  }
  const p=S.pet; p.totalDone=(p.totalDone||0)+(s.d?1:0); persist();
};

$('#clearDone').onclick=()=>{
  const done=S.wfs.filter(isFin);
  if(!done.length) return toast('没有已完成的任务');
  if(!confirm(`确定清空 ${done.length} 个已完成任务？`)) return;
  S.wfs=S.wfs.filter(w=>!isFin(w));
  persist(); render();
  addXp(5,'清理完成');
  toast(`已清空 ${done.length} 个任务`);
};

// 重要事项：清空所有已完成的通知
$('#clearNotes').onclick=()=>{
  const done=S.notes.filter(n=>n.done);
  if(!done.length) return toast('没有已完成的事项');
  if(!confirm(`确定清空 ${done.length} 条已完成事项？`)) return;
  S.notes=S.notes.filter(n=>!n.done);
  persist(); render();
  toast(`已清空 ${done.length} 条事项`);
};

// ---------------------------------------------------------------- 新建 / 编辑弹窗
const renum=()=>[...$('#steps').children].forEach((r,k)=>{
  r.querySelector('.n').textContent=k+1;
  r.querySelector('textarea').placeholder='第 '+(k+1)+' 步做什么';
});
function stepRow(v=''){
  const r=document.createElement('div');r.className='sr';
  r.innerHTML='<div class="n" title="按住拖动排序">1</div><textarea rows="1"></textarea><button class="d" title="删除此步骤">✕</button>';
  const i=r.querySelector('textarea');i.value=v;
  i.onkeydown=e=>{
    if(e.isComposing)return;
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();stepRow().focus()}
    else if(e.key==='Backspace'&&!i.value&&$('#steps').children.length>1){e.preventDefault();delRow(r,true)}
  };
  r.querySelector('.d').onclick=()=>delRow(r);
  r.querySelector('.n').addEventListener('pointerdown',ev=>startDrag(r,ev));
  $('#steps').append(r);renum();grow(i);
  return i;
}
function delRow(r,focusPrev){
  if($('#steps').children.length<=1){const q=r.querySelector('textarea');q.value='';grow(q);q.focus();return}
  const p=r.previousElementSibling;
  r.style.transition='opacity .18s,transform .18s,height .18s';
  r.style.opacity='0';r.style.transform='translateX(26px)';
  setTimeout(()=>{r.remove();renum();if(focusPrev&&p)p.querySelector('textarea').focus()},180);
}
const stepVals=()=>[...document.querySelectorAll('#steps textarea')].map(i=>i.value.trim()).filter(Boolean);

// ---- 拖动排序：滑块式（FLIP 让位动画，不是贴图跟手）----
let dragState=null;
function startDrag(row, ev){
  ev.preventDefault();
  const rect=row.getBoundingClientRect();
  dragState={row, grab:ev.clientY-rect.top, translate:0, moved:false};
  row.classList.add('drag');
  row.style.transition='none';
  document.body.style.cursor='grabbing';
  document.body.style.userSelect='none';
  document.addEventListener('pointermove',onDrag);
  document.addEventListener('pointerup',endDrag,{once:true});
}
function onDrag(ev){
  const st=dragState; if(!st) return;
  const dy=ev.clientY-st.grab-rectTopOf(st.row, st.translate);
  st.translate=dy;
  if(Math.abs(dy)>2) st.moved=true;
  st.row.style.transform=`translateY(${dy}px) scale(1.015)`;

  // 目标位置
  const cont=$('#steps');
  const kids=[...cont.children].filter(c=>c!==st.row);
  let target=kids.find(k=>{
    const r=k.getBoundingClientRect();
    return ev.clientY < r.top + r.height/2;
  })||null;
  if(st.row.nextElementSibling!==target){
    // FLIP：记录其他行的位置，重排后让它们平滑滑过去
    const before=new Map(kids.map(k=>[k,k.getBoundingClientRect().top]));
    cont.insertBefore(st.row,target);
    kids.forEach(k=>{
      const d=before.get(k)-k.getBoundingClientRect().top;
      if(!d) return;
      k.style.transition='none';
      k.style.transform=`translateY(${d}px)`;
      requestAnimationFrame(()=>{
        k.style.transition='transform .2s cubic-bezier(.2,.9,.3,1)';
        k.style.transform='';
      });
    });
    // 重排后拖动行的布局位置变了，重算 translate 让它在光标下不动
    st.translate=ev.clientY-st.grab-rectTopOf(st.row, st.translate);
    st.row.style.transform=`translateY(${st.translate}px) scale(1.015)`;
  }
}
function rectTopOf(row, translate){
  return row.getBoundingClientRect().top - (translate||0);
}
function endDrag(){
  if(!dragState) return;
  const {row, translate, moved}=dragState;
  dragState=null;
  document.body.style.cursor='';
  document.body.style.userSelect='';
  document.removeEventListener('pointermove',onDrag);
  if(moved){
    row.style.transition='transform .18s cubic-bezier(.2,.9,.3,1)';
    requestAnimationFrame(()=>{ row.style.transform=''; });
    setTimeout(()=>{ row.style.transition=''; row.style.transform=''; row.classList.remove('drag'); renum(); }, 190);
  }else{
    row.style.transform=''; row.style.transition=''; row.classList.remove('drag');
  }
  renum();
}

function drawTpl(){
  $('#tplLb').style.display=S.tpls.length?'flex':'none';
  $('#tpls').style.display=S.tpls.length?'flex':'none';
  $('#tpls').innerHTML=S.tpls.map((t,i)=>`<button class="chip" data-t="${i}">${esc(t.name)}<b data-xt="${i}">×</b></button>`).join('');
}
$('#tpls').onclick=e=>{
  const x=e.target.dataset.xt;
  if(x!==undefined){S.tpls.splice(+x,1);persist();return drawTpl()}
  const b=e.target.closest('.chip');if(!b)return;
  const t=S.tpls[+b.dataset.t];
  $('#steps').innerHTML='';t.steps.forEach(s=>stepRow(s));
  $('#wt').focus();
};

function openM(){
  editingWf=null;
  $('#mTitle').textContent='新建工作流程';
  $('#ok').textContent='创建';
  $('#wt').value='';grow($('#wt'));
  $('#steps').innerHTML='';stepRow();stepRow();
  drawTpl();
  $('#ov').classList.add('show');
  setTimeout(()=>$('#wt').focus(),120);
}
function openEdit(id){
  const w=S.wfs.find(x=>x.id===id);if(!w)return;
  editingWf=w;
  $('#mTitle').textContent=w.single?'编辑待办任务':'编辑流程';
  $('#ok').textContent='保存';
  $('#wt').value=w.t;grow($('#wt'));
  $('#steps').innerHTML='';
  const steps = w.single ? [{t:w.t}] : w.steps;
  (steps.length?steps:[{t:''}]).forEach(s=>stepRow(s.t));
  drawTpl();
  $('#ov').classList.add('show');
  setTimeout(()=>$('#wt').focus(),120);
}

$('#newWf').onclick=openM;
$('#addStep').onclick=()=>stepRow().focus();
$('#cancel').onclick=()=>$('#ov').classList.remove('show');
$('#ov').onclick=e=>{if(e.target.id==='ov')$('#ov').classList.remove('show')};
$('#wt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();const q=document.querySelector('#steps textarea');if(q)q.focus()}};

$('#ok').onclick=()=>{
  const t=$('#wt').value.trim(), st=stepVals();
  if(!t) return toast('请填写标题');
  if(editingWf){
    editingWf.t=t;
    if(editingWf.single){ editingWf.steps=[{t,d:editingWf.steps[0]?.d||false}]; }
    else{
      const old=editingWf.steps;
      const next=st.length?st:[t];
      const used=new Set();
      editingWf.steps=next.map(x=>{
        const idx=old.findIndex((o,k)=>o.t===x&&!used.has(k));
        if(idx>=0){used.add(idx);return {t:x,d:old[idx].d}}
        return {t:x,d:false};
      });
    }
    if(editingWf.single) editingWf.steps[0].t=t;
  }else{
    if(!st.length) return toast('请至少填写一个步骤');
    S.wfs.push({id:uid(),t,c:MAC[Math.random()*MAC.length|0],steps:st.map(x=>({t:x,d:false}))});
    if($('#saveTpl').checked&&!S.tpls.some(x=>x.steps.join()===st.join()))S.tpls.unshift({name:t,steps:st});
  }
  persist();render();$('#ov').classList.remove('show');
};

// ---------------------------------------------------------------- 待办任务
const shut2=()=>$('#ov2').classList.remove('show');
$('#newTask').onclick=()=>{
  editingTask=null;
  $('#m2Title').textContent='新建待办任务';
  $('#ok2').textContent='创建';
  $('#tt').value='';grow($('#tt'));
  $('#ov2').classList.add('show');
  setTimeout(()=>$('#tt').focus(),120);
};
function saveTask(){
  const t=$('#tt').value.trim();if(!t)return;
  if(editingTask){
    editingTask.t=t;
    if(editingTask.single) editingTask.steps=[{t,d:editingTask.steps[0]?.d||false}];
  }else{
    S.wfs.push({id:uid(),t,single:true,c:MAC[Math.random()*MAC.length|0],steps:[{t,d:false}]});
  }
  persist();render();shut2();
}
$('#ok2').onclick=saveTask;
$('#c2').onclick=shut2;
$('#tt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();saveTask()}};
$('#ov2').onclick=e=>{if(e.target.id==='ov2')shut2()};
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){$('#ov').classList.remove('show');shut2();closeLvPick()}
});

// ---------------------------------------------------------------- 彩带
const cv=$('#fx'),cx=cv.getContext('2d');
function boom(x,y){
  cv.width=innerWidth;cv.height=innerHeight;
  const P=Array.from({length:110},()=>({x,y,vx:(Math.random()-.5)*14,vy:Math.random()*-13-3,s:Math.random()*7+4,c:MAC[Math.random()*MAC.length|0],r:Math.random()*6,vr:(Math.random()-.5)*.4}));
  (function f(){
    cx.clearRect(0,0,cv.width,cv.height);let a=0;
    P.forEach(p=>{
      p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;if(p.y<cv.height+20)a++;
      cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore();
    });
    a?requestAnimationFrame(f):cx.clearRect(0,0,cv.width,cv.height);
  })();
}

$('#btnSettings').onclick=()=>window.api.openSettings();

function bindAll(){
  // 窗口尺寸变化时重新排布气泡
  addEventListener('resize',()=>{ if(bubbleVisible) placeBubble(); });
}

// 首次启动：给宠物起名
function firstRun(){
  if(S.pet && S.pet.named) return;
  const ov=$('#ov3'), inp=$('#petNameInput');
  inp.value=S.pet.name||'';
  ov.classList.add('show');
  setTimeout(()=>{inp.focus();inp.select()},150);
  const done=()=>{
    const v=(inp.value||'').trim().slice(0,12)||'小新';
    S.pet.name=v; S.pet.named=true;
    persist(); render();
    ov.classList.remove('show');
    pet.setState('happy');
    setTimeout(()=>say(`你好！我是 ${v} 🐾`),300);
  };
  $('#ok3').onclick=done;
  inp.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();done()}};
}

// 更新提示
window.api.onUpdateProgress(p=>{
  if(p.stage==='downloading') toast(`正在下载新版本 v${p.latest} … ${p.pct||0}%`);
  else if(p.stage==='ready') toast(`v${p.latest} 下载完成，即将重启`);
  else if(p.stage==='latest' && p.manual) toast('已是最新版本');
  else if(p.stage==='found') toast(`发现新版本 v${p.latest}`);
  else if(p.stage==='error') toast('更新失败：'+p.message);
});
