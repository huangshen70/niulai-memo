<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>宠物</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:transparent;overflow:hidden;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;user-select:none}
#wrap{position:relative;width:100%;height:100%;cursor:grab}
#wrap:active{cursor:grabbing}
#petcv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#bub{position:absolute;left:50%;top:2px;transform:translateX(-50%) translateY(-4px) scale(.94);max-width:178px;background:rgba(255,255,255,.97);color:#1d1d1f;font-size:11.5px;line-height:1.45;padding:8px 11px;border-radius:11px;box-shadow:0 8px 24px rgba(0,0,0,.22);opacity:0;transition:.22s cubic-bezier(.2,.9,.3,1.2);pointer-events:none;white-space:pre-wrap;word-break:break-all}
#bub.show{opacity:1;transform:translateX(-50%)}
#lvl{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);font-size:10px;font-weight:700;color:#fff;background:rgba(30,30,32,.72);padding:2px 8px;border-radius:99px;white-space:nowrap;pointer-events:none;opacity:.9}
@media(prefers-color-scheme:dark){
  #bub{background:rgba(48,48,52,.97);color:#f5f5f7}
}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="petcv"></canvas>
  <div id="bub"></div>
  <div id="lvl"></div>
</div>
<script src="vendor/matter.min.js"></script>
<script src="js/petdraw.js"></script>
<script>
const $=s=>document.querySelector(s);
const W=190, H=190;
let S=null, pet=null, hovering=false, drag=null;

(async function init(){
  S=await window.api.getStore();
  pet=new PetCanvas($('#petcv'),{size:132,skin:S.pet.skin||'guga',x:W/2,y:H/2+8,bounds:{w:W,h:H}});
  pet.idleAt(W/2,H/2+8);
  pet.setState('happy');
  renderLvl();
  setTimeout(()=>say(`我是 ${S.pet.name||'小牛'}`),400);

  // 悬浮窗里小幅游走，看起来有活力
  setInterval(()=>{
    if(pet.mode!=='roam'||drag) return;
    pet.tx=W/2+(Math.random()-.5)*44;
    pet.ty=H/2+8+(Math.random()-.5)*24;
    pet.state='walk';
  },3400);

  // 闲置轮播气泡
  setInterval(cycle,Math.max(3000,(S.settings.bubbleInterval)||5000));

  window.api.onStoreChanged(s=>{S=s;pet.setSkin(S.pet.skin||'guga');renderLvl()});

  const wrap=$('#wrap');
  wrap.addEventListener('mouseenter',()=>{hovering=true;window.api.petHover(true)});
  wrap.addEventListener('mouseleave',()=>{hovering=false;window.api.petHover(false)});

  // 拖动 / 点击
  wrap.addEventListener('pointerdown',async e=>{
    if(e.button!==0) return;
    drag={sx:e.screenX,sy:e.screenY,moved:0};
    const b=await window.api.petGetBounds();
    drag.wx=b?b.x:0; drag.wy=b?b.y:0;
    wrap.setPointerCapture(e.pointerId);
  });
  wrap.addEventListener('pointermove',e=>{
    if(!drag) return;
    const dx=e.screenX-drag.sx, dy=e.screenY-drag.sy;
    drag.moved=Math.max(drag.moved,Math.hypot(dx,dy));
    if(drag.moved>3) window.api.petMoveTo(drag.wx+dx,drag.wy+dy);
  });
  wrap.addEventListener('pointerup',e=>{
    if(!drag) return;
    const moved=drag.moved; drag=null;
    if(moved<4){ pet.setState('happy'); window.api.restoreMain(); }
  });
})();

function renderLvl(){
  $('#lvl').textContent=`Lv.${S.pet.lv} · ${S.pet.xp}/${50+S.pet.lv*30}`;
}
function say(text,ms=3400){
  const b=$('#bub');
  b.textContent=text; b.classList.add('show');
  clearTimeout(say._t); say._t=setTimeout(()=>b.classList.remove('show'),ms);
}
const isFin=w=>w.steps.length>0&&w.steps.every(s=>s.d);
let bi=0;
function pool(){
  const ns=S.notes.filter(n=>!n.done).map(n=>({k:'通知',t:n.t}));
  const ws=S.wfs.filter(w=>!isFin(w)).map(w=>({k:'待办',t:w.single?w.t:`${w.t} · 剩 ${w.steps.filter(s=>!s.d).length} 步`}));
  return [...ws,...ns];
}
function cycle(){
  if(hovering||drag) return;
  const p=pool();
  if(!p.length){ if(S.notes.length||S.wfs.length) say('全部完成啦 🎉'); return; }
  const it=p[bi++%p.length];
  say(`【${it.k}】${it.t}`);
}
</script>
</body>
</html>
